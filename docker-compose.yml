services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: learning
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d learning"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    build:
      context: ./backend
      target: migrate
    command: ["up"]
    environment:
      GOOSE_DBSTRING: postgres://postgres:postgres@postgres:5432/learning?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      target: server
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/learning?sslmode=disable
      LOG_FORMAT: json
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
